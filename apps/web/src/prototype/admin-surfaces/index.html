<!doctype html>
<!--
  PROTOTYPE — throwaway. Till (option A) won for both Home and Vouchers.
  Still not the live admin. Pages via ?page=home|vouchers.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin prototype</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,460;0,560;0,650;1,520&family=Fraunces:ital,opsz,wght@1,9..144,520&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0e1110;
      --sidebar: #0b0e0c;
      --card: #171c19;
      --card-2: #1e2420;
      --line: rgba(243, 236, 220, 0.09);
      --line-strong: rgba(243, 236, 220, 0.16);
      --text: #f3eee4;
      --muted: #948c7e;
      --faint: #5c564c;
      --brass: #e2b15a;
      --brass-dim: rgba(226, 177, 90, 0.14);
      --sage: #9dccae;
      --sage-dim: rgba(157, 204, 174, 0.14);
      --clay: #e08b64;
      --paper: #fbf7f0;
      --ink: #1c1916;
      --hot: #c23b2e;
      --side: 232px;
      --font: "Familjen Grotesk", sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --serif: "Fraunces", serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      background:
        radial-gradient(900px 420px at 12% -10%, rgba(226, 177, 90, 0.06), transparent 55%),
        var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-weight: 460;
      letter-spacing: -0.011em;
    }
    button, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible {
      outline: 2px solid var(--brass);
      outline-offset: 2px;
    }

    .shell { display: flex; min-height: 100%; }
    .sidebar {
      width: var(--side);
      flex: none;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 18px 12px 14px;
    }
    .brand { display: flex; gap: 10px; align-items: center; padding: 0 8px 16px; }
    .mark {
      width: 32px; height: 32px; border-radius: 9px;
      display: grid; place-items: center;
      background: var(--brass); color: #1a1408;
      font-weight: 650; letter-spacing: 0;
    }
    .brand strong { display: block; font-size: 14px; font-weight: 650; }
    .brand em { display: block; font-style: normal; color: var(--muted); font-size: 12px; margin-top: 1px; }
    .group { margin-top: 8px; }
    .group-h {
      width: 100%; text-align: left; background: none; border: 0;
      color: var(--faint); font-size: 11px; letter-spacing: 0.12em;
      padding: 10px 8px 6px; display: flex; justify-content: space-between;
    }
    .nav-btn {
      width: 100%; text-align: left; background: none; border: 0;
      color: #cfc6b6; border-radius: 8px; padding: 8px 10px;
      font-size: 14px; display: flex; justify-content: space-between; align-items: center;
    }
    .nav-btn:hover { background: rgba(243, 236, 220, 0.04); }
    .nav-btn[aria-current="page"] {
      background: var(--brass-dim);
      color: var(--text);
    }
    .nav-btn .hint { color: var(--faint); font-size: 11px; }
    .side-foot { margin-top: auto; display: flex; gap: 8px; padding-top: 12px; }
    .side-foot select, .ghost {
      background: #141816; border: 1px solid var(--line-strong);
      border-radius: 8px; padding: 7px 8px; font-size: 12px;
    }
    .ghost { color: var(--muted); }

    .main { flex: 1; min-width: 0; padding: 22px 28px 32px; }
    .top {
      display: flex; align-items: flex-end; justify-content: space-between;
      gap: 16px; margin-bottom: 22px;
    }
    .eyebrow { color: var(--muted); font-size: 12px; letter-spacing: 0.04em; }
    h1 { margin: 2px 0 0; font-size: 28px; font-weight: 650; letter-spacing: -0.03em; }
    .env {
      border: 1px solid var(--line-strong); border-radius: 999px;
      padding: 6px 12px; font-size: 13px; color: var(--muted);
    }
    .menu {
      display: none; background: #1a1f1c; border: 1px solid var(--line-strong);
      border-radius: 8px; width: 36px; height: 36px;
    }
    .scrim { display: none; }

    .lead {
      color: var(--muted); margin: -10px 0 18px; font-size: 14px;
    }
    .lead b { color: var(--text); font-weight: 560; }

    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .stats + .stats { margin-top: 12px; }
    .stat {
      background: linear-gradient(180deg, rgba(255,255,255,0.025), transparent 42%), var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px 16px;
    }
    .stat .k { color: var(--muted); font-size: 12px; }
    .stat .n {
      margin-top: 10px; font-size: 40px; line-height: 1;
      font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: -0.04em;
    }
    .stat.stock .n { color: var(--brass); }
    .stat.zero { background: transparent; border-style: dashed; }
    .stat.zero .n { color: var(--faint); }
    .section { margin-top: 28px; }
    .section h2 { margin: 0 0 12px; font-size: 15px; font-weight: 560; color: #ddd4c4; }

    .weeks { border-top: 1px solid var(--line); }
    .week, .week-h {
      display: grid;
      grid-template-columns: 76px minmax(80px, 1.4fr) 72px 64px 56px;
      gap: 12px; align-items: center;
      padding: 9px 2px;
      font-variant-numeric: tabular-nums;
      font-size: 14px;
    }
    .week { border-top: 1px solid var(--line); }
    .week-h { color: var(--faint); font-size: 12px; padding-bottom: 4px; }
    .right { text-align: right; }
    .bar { height: 5px; background: #2a302c; border-radius: 99px; overflow: hidden; }
    .bar span { display: block; height: 100%; background: var(--sage); border-radius: inherit; }
    .bar.hot span { background: var(--clay); }
    .bar.zero span { background: #3d4a42; }
    .pill {
      justify-self: end;
      font-size: 12px; padding: 2px 7px; border-radius: 999px;
      background: var(--sage-dim); color: var(--sage);
    }
    .pill.hot { background: rgba(224, 139, 100, 0.16); color: var(--clay); }
    .pill.zero { background: rgba(255,255,255,0.04); color: var(--muted); }

    .chart-card {
      margin-top: 28px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      padding: 16px 16px 8px;
    }
    .chart-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .seg { display: flex; border: 1px solid var(--line-strong); border-radius: 9px; overflow: hidden; }
    .seg button { background: transparent; border: 0; padding: 6px 10px; font-size: 12px; color: var(--muted); }
    .seg button[aria-pressed="true"] { background: var(--brass-dim); color: var(--text); }
    .chart-wrap { display: grid; grid-template-columns: 32px 1fr; gap: 8px; height: 200px; align-items: stretch; }
    .ylabs { display: flex; flex-direction: column; justify-content: space-between; color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
    svg.chart { width: 100%; height: 100%; display: block; }

    .toolbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .filters { display: flex; gap: 6px; flex-wrap: wrap; }
    .filters button {
      background: transparent; border: 1px solid var(--line); color: var(--muted);
      border-radius: 999px; padding: 6px 11px; font-size: 13px;
    }
    .filters button[aria-pressed="true"] { border-color: transparent; background: var(--brass-dim); color: var(--text); }

    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .vcard {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      display: flex; flex-direction: column;
      min-width: 0;
    }
    .vcard:hover { border-color: rgba(226, 177, 90, 0.38); }
    .well { background: #121614; }
    .vmeta { padding: 12px 14px 14px; display: grid; gap: 6px; }
    .vrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-width: 0; }
    .id-row { display: flex; justify-content: flex-end; }
    .amount { font-size: 18px; font-weight: 650; letter-spacing: -0.02em; }
    .who { color: var(--muted); font-size: 13px; }
    .dates { color: #c9c0b0; font-size: 13px; }
    .dates .soon { color: var(--clay); }
    .id { font-family: var(--mono); font-size: 11px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; display: block; }
    .check {
      background: transparent; border: 1px solid var(--line-strong);
      border-radius: 8px; padding: 6px 10px; font-size: 13px;
      flex: none;
    }
    .check:hover { border-color: var(--brass); }
    .result { font-family: var(--mono); font-size: 11px; color: var(--sage); }
    .status {
      font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 3px 7px; border-radius: 999px;
    }
    .status.available { color: var(--sage); background: var(--sage-dim); }
    .status.claimed { color: #ddc7a4; background: rgba(221, 199, 164, 0.12); }

    .receipt { min-height: 300px; display: grid; place-items: center; padding: 16px; }
    .receipt.photo {
      background:
        radial-gradient(80% 60% at 30% 0%, rgba(255,255,255,0.18), transparent 50%),
        linear-gradient(165deg, #c9b7a2, #8c7b6a 45%, #b5a48f);
    }
    .receipt.clean { background: #f3f0ea; }
    .slip {
      width: min(230px, 92%);
      background: var(--paper);
      color: var(--ink);
      padding: 18px 14px 12px;
      text-align: center;
    }
    .receipt.photo .slip {
      transform: rotate(-1.4deg);
      box-shadow: 0 14px 28px rgba(40, 24, 10, 0.35);
      clip-path: polygon(0 7px, 8% 0, 16% 6px, 27% 0, 40% 5px, 55% 0, 70% 6px, 84% 0, 100% 5px, 100% 100%, 0 100%);
    }
    .store { font-weight: 650; letter-spacing: 0.16em; font-size: 13px; }
    .store small { display: block; letter-spacing: 0.28em; font-size: 9px; margin-top: 2px; }
    .script { font-family: var(--serif); font-style: italic; font-size: 14px; margin: 4px 0 8px; }
    .offer { font-weight: 650; font-size: 20px; letter-spacing: -0.03em; }
    .deal { font-weight: 650; font-size: 22px; letter-spacing: -0.03em; margin-top: 8px; }
    .exp { color: var(--hot); font-weight: 650; font-size: 13px; margin-top: 4px; }
    .fine { font-size: 10px; line-height: 1.35; margin-top: 6px; color: #3a342c; }
    .bars { display: flex; justify-content: center; align-items: stretch; height: 54px; gap: 1px; margin: 10px 0 4px; }
    .bars i { display: block; background: transparent; }
    .bars i.on { background: #1a1714; }
    .code { font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; }
    .terms { font-size: 9px; color: #6d655b; margin-top: 6px; }

    /* Ledger: no card grid */
    .ledger-home {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 18px;
      align-items: stretch;
    }
    .sheet {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px 18px 8px;
      background: var(--card);
    }
    .sheet .big {
      font-size: 84px; line-height: 0.85; font-weight: 650;
      letter-spacing: -0.05em; color: var(--brass);
      font-variant-numeric: tabular-nums;
    }
    .sheet .big-k { color: var(--muted); margin: 8px 0 16px; }
    .dl { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; padding: 10px 0; border-top: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    .dl span { color: var(--muted); }
    .dl.zero b { color: var(--faint); }
    .rows { display: grid; gap: 8px; }
    .row {
      display: grid;
      grid-template-columns: 74px 1.3fr 0.8fr 1fr auto auto;
      gap: 12px; align-items: center;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--card);
    }
    .row:hover { border-color: rgba(226, 177, 90, 0.38); }
    .thumb { height: 72px; border-radius: 8px; overflow: hidden; }
    .thumb .receipt { min-height: 72px; padding: 0; }
    .thumb .slip { transform: none; box-shadow: none; width: 100%; padding: 8px 4px; clip-path: none; }
    .thumb .fine, .thumb .terms, .thumb .script, .thumb .bars, .thumb .code { display: none; }
    .thumb .offer, .thumb .deal { font-size: 11px; margin: 0; }
    .row .who { font-size: 12px; }
    .row-title { font-weight: 650; }

    /* Desk: inspect one */
    .desk {
      display: grid;
      grid-template-columns: minmax(320px, 1.15fr) minmax(280px, 0.85fr);
      gap: 16px;
      align-items: start;
    }
    .stage {
      border: 1px solid var(--line);
      border-radius: 16px;
      overflow: hidden;
      background: var(--card);
      position: sticky;
      top: 16px;
    }
    .stage .receipt { min-height: 420px; }
    .film { display: grid; gap: 8px; }
    .film button.pick {
      display: grid; grid-template-columns: 64px 1fr auto;
      gap: 10px; align-items: center;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 6px;
    }
    .film button.pick[aria-pressed="true"] { border-color: var(--brass); background: #221c12; }
    .ticker {
      display: flex; flex-wrap: wrap; gap: 8px 18px;
      padding: 12px 14px; margin-bottom: 16px;
      border: 1px solid var(--line); border-radius: 12px;
      background: var(--card);
      font-variant-numeric: tabular-nums;
    }
    .ticker b { font-weight: 650; }
    .ticker .dim { color: var(--faint); }
    .hero-split { display: grid; grid-template-columns: 1fr 1.3fr; gap: 16px; }
    .callout {
      border-radius: 16px; padding: 20px;
      background: var(--card); border: 1px solid var(--line);
    }
    .callout .big { font-size: 64px; font-weight: 650; letter-spacing: -0.05em; line-height: 0.9; }
    .callout p { color: var(--muted); margin: 10px 0 0; line-height: 1.45; }

    .stats.four { grid-template-columns: repeat(4, 1fr); }
    .note { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
    .alert {
      margin-top: 12px;
      display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid rgba(224, 139, 100, 0.35);
      background: rgba(224, 139, 100, 0.1);
    }
    .alert .k { color: #e7c2b0; font-size: 13px; }
    .alert .n { color: var(--clay); font-size: 36px; font-weight: 650; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
    .msgs { display: grid; gap: 10px; }
    .msg {
      border: 1px solid var(--line); border-radius: 14px;
      background: var(--card); padding: 14px 16px;
    }
    .msg p { margin: 8px 0 0; line-height: 1.45; }
    .tag {
      display: inline-block; margin-top: 6px;
      font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--muted); background: rgba(255,255,255,0.04);
      border-radius: 999px; padding: 3px 8px;
    }
    .reason span { font-family: var(--mono); font-size: 12px; color: var(--clay); }
    .shot { min-height: 280px; display: grid; place-items: center; padding: 18px 12px; }
    .shot.history, .shot.phone, .shot.mail { background: linear-gradient(165deg, #2a2622, #141210); }
    .shot.wallet { background: linear-gradient(165deg, #1c3d32, #14241e); }
    .bezel {
      width: min(168px, 78%);
      background: #0c0c0c; color: #111;
      border-radius: 16px; padding: 16px 7px 10px;
      box-shadow: 0 14px 28px rgba(0,0,0,.4);
    }
    .screen { background: #f7f4ee; border-radius: 8px; padding: 8px; min-height: 180px; }
    .shot-h { text-align: center; font-size: 10px; font-weight: 650; margin-bottom: 6px; }
    .hist { display: flex; justify-content: space-between; gap: 6px; font-size: 9px; padding: 5px 0; border-top: 1px solid #e4dfd6; }
    .hist em { font-style: normal; color: #2f7d4a; font-size: 8px; }
    .mail-sheet { width: min(200px, 86%); background: #fbf7f0; color: #1c1916; padding: 14px 12px; font-size: 10px; line-height: 1.45; }
    .mail-sheet .ln { height: 6px; background: #e6e0d6; border-radius: 99px; margin-top: 6px; }
    .keys { display: flex; gap: 3px; margin-top: 10px; }
    .keys i { flex: 1; height: 14px; background: #d9d3c8; border-radius: 3px; }
    .pass { width: min(190px, 84%); background: #f4f7f2; color: #143026; border-radius: 12px; padding: 14px 12px; text-align: center; }
    .pass .deal { color: #143026; }

    @media (max-width: 1100px) {
      .cards, .stats.four { grid-template-columns: repeat(2, 1fr); }
      .ledger-home, .desk, .hero-split { grid-template-columns: 1fr; }
      .stage { position: static; }
      .row { grid-template-columns: 64px 1fr auto; }
      .row .hide-sm { display: none; }
    }
    @media (max-width: 820px) {
      .menu { display: grid; place-items: center; }
      .sidebar {
        position: fixed; z-index: 40; transform: translateX(-105%);
        transition: transform .18s ease;
      }
      .sidebar.open { transform: none; }
      .scrim.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 30; }
      .main { padding: 16px 14px 28px; }
      .cards, .stats { grid-template-columns: 1fr; }
      .stats.four { grid-template-columns: repeat(2, 1fr); }
      .top { align-items: center; }
      h1 { font-size: 22px; }
      .week, .week-h { grid-template-columns: 64px 1fr 40px; }
      .week .hide-sm, .week-h .hide-sm { display: none; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="app.js?v=11"></script>

</body>
</html>
